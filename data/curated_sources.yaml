# ---------------------------------------------------------------------------
# Jarvis curated teachers
# ---------------------------------------------------------------------------
# Jarvis will ONLY study accounts listed here, and only after each one passes
# vetting in jarvis/learning/sources.py. Anything not in this file is ignored,
# which is what keeps random unverified "trading gurus" out of its knowledge.
#
# Every entry is scored on the `evidence` tags below. Recognised tags and their
# weights (see EVIDENCE_WEIGHTS in sources.py):
#
#   regulatory_registration    0.30  licensed / registered advisor, broker, CTA
#   audited_track_record       0.28  results verified by an independent party
#   published_positions        0.16  calls posted publicly BEFORE the outcome
#   institutional_background   0.14  verifiable fund / trading desk experience
#   published_book_or_research 0.10  authored books or peer-reviewed research
#   long_tenure                0.10  5+ years of continuous public output
#   peer_endorsement           0.06  endorsed by other verified professionals
#   platform_verified          0.06  platform verification badge
#
#   >= 0.45 -> verified    (lessons start credible)
#   >= 0.18 -> provisional (Jarvis reads it, but at low confidence)
#    < 0.18 -> rejected    (never studied)
#
# Hard disqualifiers override everything: guaranteed returns, "signals group",
# "never loses", copy-my-trades pitches, "double your money". Those are
# rejected no matter how large the account is.
#
# NOTE ON THE SHIPPED LIST: the entries below are institutions, exchanges and
# established financial newsrooms whose credentials are matters of public
# record. Individual traders are deliberately NOT pre-filled -- vouching for a
# specific person's trading record is a judgement only you can make. Add the
# ones you trust under the templates at the bottom, with honest evidence tags.
# ---------------------------------------------------------------------------

youtube:
  - handle: "@cmegroup"
    name: "CME Group"
    url: "https://www.youtube.com/@cmegroup"
    evidence:
      - regulatory_registration
      - institutional_background
      - long_tenure
      - platform_verified
    tenure_years: 15
    notes: "Derivatives exchange operator; futures and options education."

